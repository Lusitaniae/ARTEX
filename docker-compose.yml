services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Static IP: ARTEX_PG_DSN, dnsmasq host-record and extra_hosts all name this
    # address. Letting Docker allocate it means a stack down/up could move it and
    # silently break the app (see 2026-11-08 DNS incident).
    networks:
      default:
        ipv4_address: 172.18.0.2

  artex:
    # Built from this checkout. The previous reference was a third-party
    # namespace whose repository is gone: whoever controls that name could
    # publish the tag this file would pull.
    build:
      context: .
      args:
        ARTEX_VERSION: ${ARTEX_VERSION:-dev}
    # Pinned by digest, not tag. Built 2026-11-08 from 0e1a87a (gzip/ETag +
    # logo/WebP fixes on top of 6df68b1). Tag would let the registry move under us.
    # Derived from that digest + WPScan (built 2026-11-08); base digest recorded in Dockerfile.wpscan.
    image: artex:local-20261109
    # Agent processes run as an unprivileged executor (-exec-uid): no setuid program
    # or file capability may raise them back to root.
    security_opt:
      - "no-new-privileges:true"
    # The image runs as uid 10001. Start it as root so docker-entrypoint.sh can hand
    # the bind-mounted ./data and ./keys (created root-owned by the daemon) to that
    # user; the entrypoint then drops privileges, so artex itself is never root.
    user: "0:0"
    # All container DNS goes through the host logging forwarder (artex-dns),
    # query log at /var/log/artex-dns.log.
    dns:
      - 172.18.0.1
    # Belt-and-braces for the DB hostname: dnsmasq has a host-record too, but
    # /etc/hosts is consulted first and survives a dnsmasq outage.
    extra_hosts:
      - "postgres:172.18.0.2"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      ARTEX_JWT_KEY_DIR: /app/keys
      ARTEX_TRUSTED_PROXIES: ${ARTEX_TRUSTED_PROXIES:-}
      # Optional: key for secrets at rest; empty = keys/secret.key (generated at first start).
      ARTEX_SECRET_KEY: ${ARTEX_SECRET_KEY:-}
      # Untrusted-output boundary: on by default (empty = on); ARTEX_UNTRUSTED_BOUNDARY=0 in .env
      # disables it. Cost: about 154 bytes per tool result plus one system note.
      ARTEX_UNTRUSTED_BOUNDARY: ${ARTEX_UNTRUSTED_BOUNDARY:-}
      ARTEX_UPDATE_CHECK: ${ARTEX_UPDATE_CHECK:-}
      # Noise profile for target requests: off (default) | quiet | balanced | aggressive.
      ARTEX_NOISE_PROFILE: ${ARTEX_NOISE_PROFILE:-}
      ARTEX_TARGET_USER_AGENT: ${ARTEX_TARGET_USER_AGENT:-}
      # Hierarchical run budgets: unset or 0 = unlimited (no change). See README.
      ARTEX_TASK_BUDGET_TOKENS: ${ARTEX_TASK_BUDGET_TOKENS:-}
      ARTEX_TASK_BUDGET_TURNS: ${ARTEX_TASK_BUDGET_TURNS:-}
      ARTEX_INTENT_BUDGET_TOKENS: ${ARTEX_INTENT_BUDGET_TOKENS:-}
      ARTEX_INTENT_BUDGET_TURNS: ${ARTEX_INTENT_BUDGET_TURNS:-}
      # ProjectDiscovery CLIs (nuclei/httpx/katana/subfinder) otherwise call api.pdtm.sh
      # on startup. Out-of-scope egress; silent update check, disabled 2026-11-09.
      DISABLE_UPDATE_CHECK: "true"
      # WPScan API token: read by /usr/local/bin/wpscan, never passed on a command line.
      WPSCAN_API_TOKEN: ${WPSCAN_API_TOKEN:-}
    ports:
      - "${ARTEX_BIND_ADDR:-127.0.0.1}:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # Bind the runtime data directory (traffic index, task files, transcripts, etc.) to data/ in the project root,
      # so it is easy to inspect/back up on the host and survives container rebuilds.
      - ./data:/app/data
      # JWT signing key and secret key (jwt.key, secret.key), kept out of data/, which the file manager browses.
      # Persisting it keeps users signed in across container rebuilds.
      - ./keys:/app/keys
      # Mount skills/ from the project root into the container (overriding the image's built-in /app/skills);
      # skill changes require no image rebuild — the container reads the host copy.
      - ./skills:/app/skills
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.18.0.3

volumes:
  pgdata:

networks:
  default:
    # Deployment-specific: this stack runs on 172.18.0.0/16. The hardened
    # reference compose uses 172.28.0.0/24 — keep nftables/egress.env in sync.
    ipam:
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
